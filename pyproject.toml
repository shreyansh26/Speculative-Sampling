[project]
name = "speculative-sampling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "torch",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
fp8 = [
    "transformers[kernels]>=5.22.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
